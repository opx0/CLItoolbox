services:
  mongodb:
    image: mongo:7
    container_name: ${MONGO_CONTAINER_NAME:-academyos-mongodb}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-academyos}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$MONGO_INITDB_ROOT_USERNAME\" ] && [ -n \"$$MONGO_INITDB_ROOT_PASSWORD\" ]; then mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1; else mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongo-express:
    image: mongo-express:latest
    container_name: ${MONGO_EXPRESS_CONTAINER_NAME:-mongo-express}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL:-mongodb://mongodb:27017/}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-webuser}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-webpass}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"

volumes:
  mongodb_data:
